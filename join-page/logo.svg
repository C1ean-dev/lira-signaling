<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pure White Lyre Frame without background -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crossbar -->
    <line x1="28" y1="28" x2="72" y2="28" stroke-width="6" />
    <circle cx="28" cy="28" r="3.5" fill="#ffffff" stroke="none" />
    <circle cx="72" cy="28" r="3.5" fill="#ffffff" stroke="none" />

    <!-- Left curved arm -->
    <path d="M 31 28 C 21 28 16 17 24 13 C 30 10 36 17 31 28 C 23 45 22 61 40 73" stroke-width="5.5" fill="none" />

    <!-- Right curved arm -->
    <path d="M 69 28 C 79 28 84 17 76 13 C 70 10 64 17 69 28 C 77 45 78 61 60 73" stroke-width="5.5" fill="none" />

    <!-- Base soundbox -->
    <path d="M 37 72 L 63 72 L 68 85 L 32 85 Z" stroke-width="4" fill="#ffffff" fill-opacity="0.25" />
    <line x1="30" y1="85" x2="70" y2="85" stroke-width="5" />
  </g>

  <!-- Vertical White Strings -->
  <g stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.95">
    <line x1="39" y1="29" x2="39" y2="72" />
    <line x1="46" y1="29" x2="46" y2="72" />
    <line x1="54" y1="29" x2="54" y2="72" />
    <line x1="61" y1="29" x2="61" y2="72" />
  </g>
</svg>
